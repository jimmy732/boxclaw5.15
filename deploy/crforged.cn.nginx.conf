# CIRUI China site only. Install this server block for crforged.cn on the
# Beijing ECS. Do not merge it into the overseas forcarbox.cn configuration.

server {
    listen 80;
    listen [::]:80;
    server_name crforged.cn www.crforged.cn;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4188;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 390s;
        proxy_send_timeout 390s;
    }
}

# After a certificate covering both crforged.cn and www.crforged.cn has been
# installed, redirect this HTTP server to HTTPS and keep the same proxy
# headers in the certificate-managed HTTPS server block.
