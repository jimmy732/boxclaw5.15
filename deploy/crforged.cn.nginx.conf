# CIRUI China site only. Install this server block on the Beijing ECS.
# It is deliberately isolated from the overseas forcarbox.cn deployment.

server {
    listen 80;
    listen [::]:80;
    server_name crforged.cn www.crforged.cn;

    # Keep HTTP available until Alibaba Cloud security group TCP/443 is open.
    # After 443 is reachable externally, replace this block with:
    # return 301 https://crforged.cn$request_uri;
    client_max_body_size 25m;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://127.0.0.1:4188;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        # Temporary while the Alibaba security group still blocks public 443;
        # prevents the application-level canonical redirect from taking HTTP down.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 390s;
        proxy_send_timeout 390s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.crforged.cn;

    ssl_certificate /etc/letsencrypt/live/crforged.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crforged.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://crforged.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crforged.cn;

    ssl_certificate /etc/letsencrypt/live/crforged.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crforged.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://127.0.0.1:4188;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 390s;
        proxy_send_timeout 390s;
    }
}

# Previous static ICP page retained locally for rollback/reference only.
server {
    listen 127.0.0.1:4189;
    server_name _;

    root /usr/share/nginx/html/cerui-icp;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /site-config.js {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(css|js|svg|txt)$ {
        expires 1d;
    }
}
