# Copy the proxy locations into the existing Certbot-managed HTTPS server
# block for forcarbox.cn. Keep the certificate directives generated by
# Certbot; this file only documents the F-Box application locations.

# CIRUI China site. Install this only on its dedicated production hostname;
# do not replace the existing overseas storefront by accident.
location / {
    proxy_pass http://127.0.0.1:4188;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 390s;
}

location /api/ {
    proxy_pass http://127.0.0.1:4188;
    proxy_http_version 1.1;
    client_max_body_size 25m;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 390s;
}

location /admin-api/ {
    proxy_pass http://127.0.0.1:4188;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
